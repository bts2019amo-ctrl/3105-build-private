name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate clean Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          rm -rf Generated.xcodeproj
          xcodegen generate --spec project.yml --project Generated.xcodeproj
          test -d Generated.xcodeproj
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Generated.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_EMIT_LOC_STRINGS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log
      - name: Package IPA
        run: |
          set -euo pipefail
          test -d build/Build/Products/Release-iphoneos/3105.app
          rm -rf Payload build/export
          mkdir -p Payload build/export
          cp -R build/Build/Products/Release-iphoneos/3105.app Payload/3105.app
          /usr/bin/zip -qry build/export/3105-unsigned.ipa Payload
          shasum -a 256 build/export/3105-unsigned.ipa | tee build/export/SHA256SUMS.txt
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-build-output
          path: |
            build/export/3105-unsigned.ipa
            build/export/SHA256SUMS.txt
            build.log
          if-no-files-found: warn
