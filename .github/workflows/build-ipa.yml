name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          rm -rf ThreeOneOSFive.xcodeproj
          xcodegen generate --spec project.yml
          test -d ThreeOneOSFive.xcodeproj
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild build -project ThreeOneOSFive.xcodeproj -scheme 3105 -configuration Release -sdk iphoneos -derivedDataPath build COMPILER_INDEX_STORE_ENABLE=NO SWIFT_EMIT_LOC_STRINGS=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log
      - name: Restore resources and full-screen metadata
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/3105.app
          test -d "$APP"
          mkdir -p "$APP/patch_assets"
          cp -R ThreeOneOSFive/patch_assets/. "$APP/patch_assets/"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName LaunchScreen" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen YES" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :UIDeviceFamily:0 1" "$APP/Info.plist" || true
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/3105.app Payload/3105.app
          rm -f 3105-unsigned.ipa
          zip -qry 3105-unsigned.ipa Payload
          test -s 3105-unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: 3105-unsigned.ipa
          if-no-files-found: error
