name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, proxy-system-build25 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          rm -rf ThreeOneOSFive.xcodeproj
          xcodegen generate --spec project.yml
          test -d ThreeOneOSFive.xcodeproj

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_EMIT_LOC_STRINGS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log

      - name: Restore resources and full-screen metadata
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/3105.app
          ASSET_OUT=build/assetcatalog
          test -d "$APP"
mkdir -p "$APP/Patches"
cp -R ThreeOneOSFive/Patches/. "$APP/Patches/"
test "$(find "$APP/Patches" -type f -name "*.3105" | wc -l | tr -d " ")" -eq 14
          rm -rf "$ASSET_OUT"
          mkdir -p "$ASSET_OUT"
          xcrun actool \
            --platform iphoneos \
            --minimum-deployment-target 16.0 \
            --target-device iphone \
            --target-device ipad \
            --app-icon AppIcon \
            --compile "$ASSET_OUT" \
            --output-partial-info-plist "$ASSET_OUT/assetcatalog_generated_info.plist" \
            ThreeOneOSFive/Assets.xcassets
          plutil -replace CFBundleIconName -string AppIcon "$APP/Info.plist" 2>/dev/null || plutil -insert CFBundleIconName -string AppIcon "$APP/Info.plist"
          plutil -replace CFBundleDisplayName -string "PROXY SYSTEM" "$APP/Info.plist" 2>/dev/null || plutil -insert CFBundleDisplayName -string "PROXY SYSTEM" "$APP/Info.plist"
          plutil -replace CFBundleName -string "PROXY SYSTEM" "$APP/Info.plist" 2>/dev/null || plutil -insert CFBundleName -string "PROXY SYSTEM" "$APP/Info.plist"
          plutil -replace UILaunchStoryboardName -string LaunchScreen "$APP/Info.plist" 2>/dev/null || plutil -insert UILaunchStoryboardName -string LaunchScreen "$APP/Info.plist"
          plutil -replace UIRequiresFullScreen -bool true "$APP/Info.plist" 2>/dev/null || plutil -insert UIRequiresFullScreen -bool true "$APP/Info.plist"
          plutil -replace UIDeviceFamily -json '[1]' "$APP/Info.plist" 2>/dev/null || plutil -insert UIDeviceFamily -json '[1]' "$APP/Info.plist"
          plutil -replace UISupportedInterfaceOrientations -json '["UIInterfaceOrientationPortrait"]' "$APP/Info.plist" 2>/dev/null || plutil -insert UISupportedInterfaceOrientations -json '["UIInterfaceOrientationPortrait"]' "$APP/Info.plist"
          plutil -replace UIApplicationSceneManifest -json '{"UIApplicationSupportsMultipleScenes":false}' "$APP/Info.plist" 2>/dev/null || plutil -insert UIApplicationSceneManifest -json '{"UIApplicationSupportsMultipleScenes":false}' "$APP/Info.plist"
          cp -f "$ASSET_OUT/Assets.car" "$APP/Assets.car"
          cp -f ThreeOneOSFive/LaunchScreen.storyboard "$APP/LaunchScreen.storyboard"
          for lang in en vi zh-Hans; do
            mkdir -p "$APP/$lang.lproj"
            if [ -f "ThreeOneOSFive/$lang.lproj/Localizable.strings" ]; then
              cp -f "ThreeOneOSFive/$lang.lproj/Localizable.strings" "$APP/$lang.lproj/Localizable.strings"
            fi
          done
          plutil -p "$APP/Info.plist"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/3105.app Payload/3105.app
          rm -f 3105-unsigned.ipa
          zip -qry 3105-unsigned.ipa Payload
          test -s 3105-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: 3105-unsigned.ipa
          if-no-files-found: error
