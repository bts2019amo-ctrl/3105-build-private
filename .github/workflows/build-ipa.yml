name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  SCHEME: ThreeOneOSFive
  PROJECT: ThreeOneOSFive.xcodeproj
  ARCHIVE_PATH: ${{ github.workspace }}/build/3105.xcarchive
  EXPORT_PATH: ${{ github.workspace }}/build/export

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive unsigned app
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/3105.app"
          test -d "$APP_PATH"
          rm -rf Payload "$EXPORT_PATH"
          mkdir -p Payload "$EXPORT_PATH"
          cp -R "$APP_PATH" Payload/3105.app
          /usr/bin/zip -qry "$EXPORT_PATH/3105-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: ${{ env.EXPORT_PATH }}/3105-unsigned.ipa
          if-no-files-found: error
